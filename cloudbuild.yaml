# Google Cloud Build configuration
# Builds and deploys Lili Voice Agent to Cloud Run

steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lili-voice-agent:$SHORT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/lili-voice-agent:latest'
      - '.'

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/lili-voice-agent:$SHORT_SHA'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'lili-voice-agent'
      - '--image'
      - 'gcr.io/$PROJECT_ID/lili-voice-agent:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GOOGLE_API_KEY=${_GOOGLE_API_KEY}'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--concurrency'
      - '80'
      - '--max-instances'
      - '10'

# Store images in Google Container Registry
images:
  - 'gcr.io/$PROJECT_ID/lili-voice-agent:$SHORT_SHA'
  - 'gcr.io/$PROJECT_ID/lili-voice-agent:latest'

# Timeout for the build
options:
  logging: CLOUD_LOGGING_ONLY

timeout: 600s
